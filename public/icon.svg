<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Outer subtle ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#FDBA74" stroke-width="6" opacity="0.4" stroke-dasharray="16 12"/>

  <!-- Speed lightning / bolt behind plate -->
  <path d="M 330 110 L 250 240 L 295 240 L 200 400 L 235 270 L 195 270 Z" fill="#FDE047" opacity="0.35"/>

  <!-- Steaming Casserole / Bowl with Taco & Enchiladas -->
  <g filter="url(#shadow)">
    <!-- Steam lines -->
    <path d="M 210 180 Q 200 140 220 110 Q 235 90 225 70" fill="none" stroke="#FFF" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
    <path d="M 256 170 Q 270 135 250 100 Q 240 80 256 60" fill="none" stroke="#FFF" stroke-width="12" stroke-linecap="round" opacity="0.95"/>
    <path d="M 302 180 Q 315 145 295 115 Q 285 95 300 75" fill="none" stroke="#FFF" stroke-width="10" stroke-linecap="round" opacity="0.85"/>

    <!-- Bowl / Plate Base -->
    <path d="M 120 250 C 120 350, 392 350, 392 250 Z" fill="#FFFFFF"/>
    <path d="M 120 250 C 120 270, 392 270, 392 250 C 392 230, 120 230, 120 250 Z" fill="#F3F4F6"/>

    <!-- Delicious food filling: taco & enchiladas -->
    <ellipse cx="256" cy="245" rx="125" ry="32" fill="#D97706"/>
    <ellipse cx="230" cy="242" rx="40" ry="16" fill="#16A34A"/>
    <ellipse cx="290" cy="245" rx="45" ry="18" fill="#DC2626"/>
    <circle cx="260" cy="240" r="14" fill="#FEF08A"/>

    <!-- Fork & Chef Hat Fast badge -->
    <circle cx="360" cy="330" r="48" fill="url(#gold)" stroke="#FFFFFF" stroke-width="6"/>
    <!-- Fast Lightning in badge -->
    <path d="M 368 302 L 344 330 L 360 330 L 350 358 L 378 326 L 362 326 Z" fill="#7C2D12"/>
  </g>

  <!-- Typography: COCINA EXPRESS -->
  <text x="256" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="42" fill="#FFFFFF" letter-spacing="3">COCINA EXPRESS</text>
  <text x="256" y="455" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#FDE047" letter-spacing="5">PUNTO DE VENTA</text>
</svg>
